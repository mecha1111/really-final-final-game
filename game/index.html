<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>game</title>
    <link rel="stylesheet" href="./style.css" />
    <!--
      Verse8 임베드 호스트에게 실제 문서 크기를 알려주는 스크립트.
      게임 로직과 무관 — 건드리지 말 것. (플랫폼 요구사항)
    -->
    <script>
      (function () {
        function reportGameSize() {
          const height = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
          const width = Math.max(document.body.scrollWidth, document.documentElement.scrollWidth);
          window.parent.postMessage(
            {
              type: 'GAME_SIZE_RESPONSE',
              height: height,
              width: width,
            },
            '*',
          );
        }

        window.addEventListener('load', reportGameSize);
        window.addEventListener('resize', reportGameSize);
        window.addEventListener('message', function (event) {
          if (event.data && event.data.type === 'REQUEST_GAME_SIZE') {
            reportGameSize();
          }
        });
      })();
    </script>
  </head>
  <body>
    <!-- 캔버스는 항상 창 전체를 채운다(내부 해상도는 1920x1080 그대로, CSS로만
         확대/축소). 디버그 패널은 레이아웃에서 자리를 차지하지 않고 이 위에
         반투명 오버레이로 뜬다 — 켜져도 캔버스가 밀리거나 줄어들지 않는다. -->
    <canvas id="game-canvas"></canvas>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
