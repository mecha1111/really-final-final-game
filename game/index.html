<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>game</title>
    <link rel="stylesheet" href="./style.css" />
    <!--
      Verse8 임베드 호스트에게 실제 문서 크기를 알려주는 스크립트.
      게임 로직과 무관 — 건드리지 말 것. (플랫폼 요구사항)
    -->
    <script>
      (function () {
        function reportGameSize() {
          const height = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
          const width = Math.max(document.body.scrollWidth, document.documentElement.scrollWidth);
          window.parent.postMessage(
            {
              type: 'GAME_SIZE_RESPONSE',
              height: height,
              width: width,
            },
            '*',
          );
        }

        window.addEventListener('load', reportGameSize);
        window.addEventListener('resize', reportGameSize);
        window.addEventListener('message', function (event) {
          if (event.data && event.data.type === 'REQUEST_GAME_SIZE') {
            reportGameSize();
          }
        });
      })();
    </script>
  </head>
  <body>
    <!--
      #desktop = 1920x1080 고정 좌표계. ui/canvasFit.js가 여기에 zoom을 걸어서
      통째로 창 크기에 맞춘다(비율 유지 + 레터박스, 픽셀폰트가 안 뭉개지는 이유는
      style.css의 #stage/#desktop 주석 참고). 캔버스도 이 안에 들어 있으므로
      HTML과 캔버스가 항상 같은 배율로 함께 움직인다 — zoom도 transform과 똑같이
      getBoundingClientRect()에 반영되므로 클릭 좌표 역변환이 그대로 맞는다.

      레이어 z순서(위 → 아래). 방해꾼이 창보다 위다 — 정보를 가려도 되고, 창 위에
      떠 있는 방해꾼도 반드시 클릭이 맞아야 한다(systems/input.js가 캔버스에서 방해꾼을
      못 맞히면 클릭을 그대로 아래 레이어로 통과시켜서 창 드래그·팝업 닫기는 그대로 산다):
       10 .layer-crt   화면 전환 CRT 킥            pointer-events:none  ← phase가 바뀐 프레임에만 1회 재생, 그 외엔 투명
        6 .layer-title 타이틀 화면(HTML)          pointer-events:none  ← phase==='title'일 때만 보임(캔버스보다 위)
        5 #game-canvas 방해꾼                    pointer-events:auto  ← 못 맞히면 아래로 통과
        4 .layer-win   HTML 창(상태.dat/.exe)    pointer-events:auto
        3 .layer-gag   HTML 개그팝업             pointer-events:auto
        2 .layer-deco  개그아이콘·작업표시줄      pointer-events:none  ← 클릭 통과(장식)
        1 .layer-bg    Bliss 배경                pointer-events:none

      .layer-title이 캔버스보다 위지만 pointer-events:none 컨테이너라, 로고/버튼이
      아닌 빈 자리를 누르면 그대로 캔버스까지 뚫고 내려간다 — 다만 title 단계에선
      캔버스가 아무것도 안 그리고 클릭도 안 받으므로(ui/render.js, systems/input.js)
      해가 없다. gag/win의 "클릭 통과"와는 반대 방향(위에서 아래로 그냥 새는 것뿐,
      elementFromPoint 재발사 같은 별도 장치 불필요)이라 더 단순하다.
    -->
    <!--
      #stage = 뷰포트를 꽉 채우는 껍데기. #desktop을 가운데 정렬(레터박스)만 한다.
      zoom은 레이아웃 크기 자체를 바꾸므로 flex 가운데 정렬이 배율을 저절로 반영한다
      — 예전처럼 translate로 여백을 직접 계산해 밀어줄 필요가 없다.
    -->
    <div id="stage">
      <div id="desktop">
      <div class="layer-bg">
        <div class="grid"></div>
        <div class="hill"></div>
        <div class="hill2"></div>
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
      </div>

      <!-- 클릭 무반응 장식. pointer-events:none이라 위를 클릭해도 캔버스(방해꾼)로 통과한다. -->
      <div class="layer-deco">
        <div class="icons">
          <div class="icon"><div class="ib">🐬</div><div class="il">절대_바이러스<br />아님_진짜_전<br />_돌고래임.exe</div></div>
          <div class="icon"><div class="ib">📁</div><div class="il">숙제(안함)</div></div>
          <div class="icon"><div class="ib">🛡️</div><div class="il">V3보다좋음.exe</div></div>
          <div class="icon"><div class="ib">💾</div><div class="il">야한거아님.zip</div></div>
          <div class="icon"><div class="ib">🎮</div><div class="il">공부자료.exe</div></div>
          <div class="icon"><div class="ib">🗑️</div><div class="il">휴지통</div></div>
        </div>

        <div class="taskbar">
          <div class="start">🪟 시작</div>
          <div class="ti">■ 상태.dat</div>
          <div class="ti">! 진짜_최종…(5).exe</div>
          <div class="clock" id="tb-clock">오후 11:59</div>
        </div>
      </div>

      <canvas id="game-canvas"></canvas>

      <!-- 개그 팝업이 동적으로 들어가는 자리 (ui/desktop.js가 채운다) -->
      <div class="layer-gag" id="layer-gag"></div>

      <!-- 게임 상태 창들. ui/statusWindow.js가 내용을 매 프레임 갱신한다. -->
      <div class="layer-win">
        <div class="win winA" id="win-status">
          <div class="tbar">
            <div class="ico">■</div>
            <div class="t">상태.dat</div>
            <div class="wb"><span class="min">_</span><span>□</span><span class="x">×</span></div>
          </div>
          <div class="body">
            <div class="dayflag"><span class="d" id="st-stage">1 구간</span><span class="hard" id="st-tag">START</span></div>
            <div class="grp">
              <div class="h">할당량</div>
              <div class="c">
                <div class="big"><span id="st-uploaded">0</span><span class="unit"> / <span id="st-quota">200</span> MB</span></div>
                <div class="xpbar" id="st-quotabar"></div>
              </div>
            </div>
            <div class="grp"><div class="h">남은 시간</div><div class="c"><div class="big time" id="st-time">03:00</div></div></div>
            <div class="grp">
              <div class="h">건너뛰기 (S)</div>
              <div class="c"><div class="skips" id="st-skips"></div></div>
            </div>
          </div>
        </div>

        <div class="win winB" id="win-upload">
          <div class="tbar">
            <div class="ico">!</div>
            <div class="t">진짜_최종_final_수정_진짜최종(5).exe</div>
            <div class="wb"><span class="min">_</span><span>□</span><span class="x">×</span></div>
          </div>
          <div class="menu"><span>파일(F)</span><span>편집(E)</span><span>보기(V)</span><span>도움말(H)</span></div>
          <div class="body">
            <div class="frame">
              <div class="img" id="up-thumb">그림</div>
              <div class="cap"><span id="up-caption">업데이트 중…</span><b id="up-size">60MB</b></div>
            </div>
            <div class="up">
              <div class="lab"><span>업데이트</span><span id="up-pct">0%</span></div>
              <div class="xpbar big" id="up-bar"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 타이틀 화면(HTML 오버레이). style.css의 .phase-title 규칙으로 phase==='title'일
           때만 보인다(ui/desktop.js의 syncDesktopPhase가 토글). 배경/로고 애니는 순수 CSS고,
           버튼 3개(시작/설정/나가기) 훅만 ui/titleScreen.js가 붙인다. -->
      <div class="layer-title" id="layer-title">
        <div id="title-stage">
          <div id="title-bg"></div>
          <div id="title-logo-wrap">
            <div id="title-logo" title="진짜_최종_final_수정_진짜최종(5).exe"></div>
          </div>
          <div id="title-menu">
            <div class="btn" id="title-btn-start">게임 시작</div>
            <div class="btn" id="title-btn-settings">설정</div>
            <div class="btn" id="title-btn-quit">나가기</div>
          </div>
        </div>
      </div>

      <!-- 화면 전환 CRT 킥(레이어10, 항상 최상단). phase가 바뀌는 순간에만
           ui/crtTransition.js가 애니를 1회 재시작시킨다 — 평소엔(재생 안 할 땐)
           투명해서 아무 것도 안 보이고 클릭도 pointer-events:none이라 절대 안 먹는다. -->
      <div class="layer-crt" id="layer-crt">
        <div class="crt-scanlines"></div>
        <div class="crt-flash"></div>
        <div class="crt-line"></div>
      </div>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
