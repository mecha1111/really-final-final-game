name: Deploy game to GitHub Pages

# develop에 push될 때마다 dist/를 빌드해 GitHub Pages로 배포한다.
# ★ 이 저장소에는 xp-landing 같은 기존 Pages 배포가 없다(확인 완료, 2026-09-09) —
#   그래서 경로를 나누지 않고 게임을 Pages 루트(https://mecha1111.github.io/really-final-final-game/)에
#   그대로 올린다. 나중에 다른 정적 사이트를 같은 저장소에 얹게 되면, 그때는
#   dist/를 하위 폴더(예: dist/app/)로 옮기거나 두 번째 배포 대상을 새 저장소/새
#   Pages 사이트로 분리하는 쪽을 먼저 검토할 것 — 한 저장소는 GitHub Pages
#   배포처를 하나만 가질 수 있다.
on:
  push:
    branches: [develop]
  workflow_dispatch: # Actions 탭에서 수동 재실행하고 싶을 때

permissions:
  contents: read
  pages: write
  id-token: write

# 배포 도중 새 push가 들어와도 겹쳐 돌지 않게(Pages 배포는 동시 실행을 지원 안 함).
# 대기 중이던 실행은 취소하지 않고 최신 것만 기다리게 둔다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
